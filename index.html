<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFront</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #888; font: 14px system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
  p { margin: 0; padding: 1rem; max-width: 32rem; }
</style>
</head>
<body>
<p id="msg"></p>

<script>
(function () {
  var GAME_ORIGIN = 'https://openfront.io';
  var TAB_TITLE = 'OpenFront';   // what the about:blank tab is called
  var msg = document.getElementById('msg');

  // Turn this page's #hash into the URL to load in the game frame.
  //   #/w5/game/AbCdEfGh?live            -> https://openfront.io/w5/game/AbCdEfGh?live
  //   #https://openfront.io/w5/game/Ab   -> same thing (a pasted full link)
  //   #join=AbCdEfGh                     -> https://openfront.io/#join=AbCdEfGh
  //   (no hash)                          -> https://openfront.io/
  // Anything that is not OpenFront falls back to the home page.
  function hashToGameUrl(hash) {
    var h = hash.replace(/^#/, '');
    if (!h) return GAME_ORIGIN + '/';

    if (/^https?:\/\//i.test(h)) {
      try {
        var u = new URL(h);
        var allowed = new URL(GAME_ORIGIN);
        if (u.hostname === allowed.hostname || u.hostname === 'www.' + allowed.hostname) {
          return GAME_ORIGIN + u.pathname + u.search + u.hash;
        }
      } catch (e) {}
      return GAME_ORIGIN + '/';
    }

    if (h.charAt(0) === '/') return GAME_ORIGIN + h;
    return GAME_ORIGIN + '/#' + h;
  }

  // Open a blank tab and put the fullscreen game frame inside it.
  function launch() {
    var win = window.open('about:blank', '_blank');
    if (!win) {
      msg.textContent = 'Click anywhere to open the game in a new about:blank tab. ' +
                        'If nothing happens, allow pop-ups for this site.';
      return;
    }

    var doc = win.document;
    doc.title = TAB_TITLE;

    var style = doc.createElement('style');
    style.textContent =
      'html,body{margin:0;height:100%;background:#000;overflow:hidden}' +
      'iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0;display:block}';
    doc.head.appendChild(style);

    var frame = doc.createElement('iframe');
    frame.title = 'OpenFront';
    frame.setAttribute('allow', 'fullscreen; autoplay; clipboard-read; clipboard-write; gamepad');
    frame.setAttribute('allowfullscreen', '');
    frame.src = hashToGameUrl(location.hash);
    doc.body.appendChild(frame);
    frame.addEventListener('load', function () { frame.focus(); });

    msg.textContent = 'Opened in a new about:blank tab. Click anywhere to open it again.';
  }

  document.addEventListener('click', launch);
  launch();
})();
</script>
</body>
</html>
